version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nextmove
      POSTGRES_PASSWORD: nextmove
      POSTGRES_DB: nextmove
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: rq worker --url redis://redis:6379

volumes:
  pgdata:
